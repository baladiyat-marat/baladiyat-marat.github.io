<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>إرسال ذكرى أمسية شتاء مرات</title>
<style>
@font-face{font-family:Bahij;src:url(thikra/bahij.woff2) format("woff2");font-weight:400}
@font-face{font-family:Bahij;src:url(thikra/bahij-bold.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Bahij,sans-serif;background:#f4e8cc;color:#4a3220}
header{background:#5a3a1a;color:#fff;text-align:center;padding:26px 18px 22px}
.logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.logos img{height:34px}.logos img.w{height:46px}.logos i{width:1px;height:32px;background:rgba(255,255,255,.45)}
h1{font-size:23px;font-weight:700}
header p{font-size:14.5px;line-height:1.8;opacity:.9;margin-top:6px}
.prog{font-size:14px;color:#e9c77a;margin-top:8px}
ul{list-style:none;max-width:560px;margin:0 auto;padding:6px 16px 20px}
li{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px dashed #c9a87a}
.n{color:#a08060;font-size:14px;width:24px;text-align:center;flex:none}
.nm{flex:1;font-size:17px;font-weight:700}
a.s{flex:none;display:inline-flex;align-items:center;gap:6px;background:#1f8a4c;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:9px 16px;border-radius:30px}
a.s svg{width:17px;height:17px}
li.done .nm{color:#a08060}
li.done a.s{background:#cbb48f}
li.done a.s:after{content:" ✓"}
footer{text-align:center;padding:10px 16px 30px;font-size:13.5px;color:#8b6a4a}
</style></head><body>
<header>
  <div class="logos"><img src="thikra/assoc_white.webp" alt=""><i></i><img class="w" src="thikra/winter_white.webp" alt=""><i></i><img src="thikra/bal_white.webp" alt=""></div>
  <h1>إرسال ذكرى أمسية شتاء مرات</h1>
  <p>اضغط «أرسل» جنب اسم الضيف، فيفتح الواتس برسالة الشكر ورابط صفحته باسمه، ثم اختره من جهات الاتصال.</p>
  <div class="prog" id="prog"></div>
</header>
<ul id="list"></ul>
<footer>بلدية محافظة مرات</footer>
<script>
var PAGE="https://baladiyat-marat.github.io/shita/thikra-tajriba.html";
var CODES=["q9k7", "x2va", "vnwa", "ut9d", "7857", "kq88", "99fs", "cqmh", "99zw", "d278", "wsqu", "5asj", "6hu3", "96mv", "m4a4", "dmcd", "rzb4", "cpdr", "zzx9", "n7at", "hgbp", "kwe5", "9wwd", "sfu9", "78p5", "w5ph", "zckc", "hj3c", "3p2m", "7nn2", "dw9z", "7spa", "9vwy", "7kj4", "rhq8", "ffgd"];
var NAMES=["احمد عوض الشهري", "بدر مبارك العصيمي", "جاسم الدلبحي", "جهز عبدالله الحزيمي", "خالد الدباسي", "خالد بن حمد اليوسف", "دغيشم فهد الدغيشم", "م/ عبدالله محمد التميمي", "زيد بن خالد العقيل", "سالم بن محمد العيدي", "سامي فتحي عودة", "سعد علي العليان", "سفر العلياني", "عبدالاله المشعل", "عبدالله الحربي", "عبدالله بن شخبوط بن عبدالله الحنابجه", "عبدالله عيد العصيمي", "عبدالملك الهويمل", "علي عسيري", "فارس ال عادي", "فارس بن عبدالله ال عادي", "فهد بن حمد الشبيكي", "فيصل الجهني", "م/ فيصل ظافر القحطاني", "م/ ابراهيم بن سعد ال عون", "م/ ريان محمد الجلاّل", "م/ هيف بن مسفر بن مهوس", "م/ أحمد فهد الدلبحي", "م/ عبدالله القحطاني", "مبارك بدر جميلان الحمادي", "محمد ال عادي", "محمد سالم القحطاني", "محمد علي محمود", "مسفر بن هادي القحطاني", "مسفر محمد القحطاني", "نايف بن فريح الحربي"];
var KEY="marat-thikra-sent", sent={};
try{sent=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
var wa='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.4-.9-2.8-1.2-4.6-4.1-4.8-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
var digits=function(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})};
var ul=document.getElementById("list");
function prog(){var c=NAMES.filter(function(n){return sent[n]}).length;document.getElementById("prog").textContent="تم الإرسال: "+digits(c)+" من "+digits(NAMES.length)}
NAMES.forEach(function(n,i){
  var url=PAGE+"?g="+CODES[i];
  var msg="السلام عليكم ورحمة الله\nحيّاك الله "+n+"، نشكر لك تشريفنا في أمسية شتاء مرات، وهذه ذكرى من الليلة:\n"+url+"\nمع تحيات بلدية محافظة مرات";
  var li=document.createElement("li"); if(sent[n]) li.className="done";
  li.innerHTML='<span class="n">'+digits(i+1)+'</span><span class="nm"></span><a class="s" target="_blank" rel="noopener">'+wa+'أرسل</a>';
  li.querySelector(".nm").textContent=n;
  var a=li.querySelector("a"); a.href="https://wa.me/?text="+encodeURIComponent(msg);
  a.addEventListener("click",function(){sent[n]=1;li.className="done";try{localStorage.setItem(KEY,JSON.stringify(sent))}catch(e){};prog()});
  ul.appendChild(li);
});
prog();
</script></body></html>
